[project]
name = "integration-factory"
version = "0.1.0"
description = "Agentic pipeline that turns vendor API docs into tested XSOAR integration drafts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "pydantic>=2",
    "anthropic",
    "python-dotenv",
    "pyyaml",
    "rank-bm25",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integration_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
